<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manik Patil | Data Analyst Portfolio</title>

<meta name="description"
content="Manik Patil's portfolio showcasing Data Analytics, SQL, Python, Power BI, Tableau and business intelligence projects.">

<style>
:root {
    --bg: #020817;
    --card: rgba(5, 22, 45, 0.88);
    --blue: #079cff;
    --cyan: #00e5ff;
    --text: #f3f8ff;
    --muted: #b8c9df;
    --border: rgba(0, 174, 255, 0.35);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
}

/* Animated background canvas */
#dataCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
}

.background-glow {
    position: fixed;
    inset: 0;
    z-index: -3;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 15% 25%,
        rgba(0, 85, 200, 0.22), transparent 45%),
        radial-gradient(ellipse at 85% 55%,
        rgba(0, 210, 255, 0.12), transparent 42%),
        linear-gradient(135deg, #020617, #06152e, #010611);
    background-size: 200% 200%;
    animation: backgroundShift 18s ease-in-out infinite;
}

@keyframes backgroundShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Navigation */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(2, 8, 23, 0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}

.navbar {
    max-width: 1150px;
    margin: auto;
    padding: 15px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: white;
    white-space: nowrap;
}

.logo span {
    color: var(--cyan);
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

nav a {
    color: #dceaff;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s;
}

nav a:hover {
    color: var(--cyan);
}

/* Hero section */
.hero {
    min-height: 570px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    max-width: 1100px;
    margin: auto;
    padding: 90px 25px 70px;
    position: relative;
}

.eyebrow {
    color: var(--cyan);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 13px;
    margin-bottom: 12px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 76px);
    line-height: 1.1;
    margin-bottom: 15px;
}

.hero h1 span {
    color: var(--cyan);
    text-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
}

.hero h2 {
    font-size: clamp(20px, 3vw, 28px);
    color: #d7e8ff;
    margin-bottom: 12px;
}

.hero p {
    max-width: 650px;
    color: var(--muted);
    font-size: 17px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 13px;
    margin-top: 27px;
}

.btn {
    display: inline-block;
    padding: 11px 20px;
    border: 1px solid var(--blue);
    border-radius: 7px;
    color: white;
    text-decoration: none;
    background: rgba(0, 132, 255, 0.12);
    transition: 0.3s;
    font-size: 14px;
}

.btn.primary {
    background: linear-gradient(110deg, #087cff, #00b8ff);
    border-color: transparent;
    font-weight: bold;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 22px rgba(0, 174, 255, 0.35);
}

/* Sections */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

section.content-section {
    padding: 32px 0;
    scroll-margin-top: 80px;
}

.section-title {
    font-size: 30px;
    margin-bottom: 22px;
    color: var(--cyan);
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 27px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.16);
    backdrop-filter: blur(8px);
}

.card p {
    color: var(--muted);
}

.card h3 {
    color: white;
    margin-bottom: 10px;
}

.card h3 span {
    color: var(--cyan);
}

/* Skills */
.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.skill {
    padding: 7px 14px;
    border: 1px solid var(--blue);
    border-radius: 25px;
    background: rgba(0, 140, 255, 0.09);
    color: #e4f5ff;
    font-size: 14px;
    transition: 0.3s;
}

.skill:hover {
    background: rgba(0, 174, 255, 0.22);
    transform: translateY(-3px);
    box-shadow: 0 0 14px rgba(0, 174, 255, 0.22);
}

/* Projects grid */
.project-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

.project-card {
    display: flex;
    flex-direction: column;
    min-height: 220px;
    transition: transform 0.3s, border-color 0.3s;
}

.project-card:hover {
    transform: translateY(-5px);
    border-color: var(--cyan);
}

.project-card p {
    margin-bottom: 18px;
    flex-grow: 1;
}

.project-card .btn {
    align-self: flex-start;
}

/* Certificates */
.certificate-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.certificate-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
}

.certificate-item p {
    color: var(--muted);
    font-size: 14px;
}

/* Contact */
.contact-links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

footer {
    text-align: center;
    padding: 28px 15px;
    color: #94aac5;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    font-size: 14px;
}

/* Scroll reveal */
.reveal {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

/* Responsive */
@media (max-width: 700px) {
    .navbar {
        flex-direction: column;
        gap: 10px;
    }

    nav {
        justify-content: center;
        gap: 12px;
    }

    nav a {
        font-size: 12px;
    }

    .hero {
        min-height: 480px;
        padding-top: 65px;
    }

    .project-grid,
    .certificate-list {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }

    .section-title {
        font-size: 26px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

            <a href="#certificates">Certificates</a>
            <a href="#contact">Contact</a>
        </nav>
    </div>
</header>
